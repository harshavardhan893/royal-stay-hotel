    <meta name="description"
        content="Book your stay at Royal Stay Hotel. Reserve Deluxe or Luxury Rooms online with comfortable accommodation and modern facilities in Hyderabad.">

    <meta name="keywords"
        content="Hotel Booking, Royal Stay Hotel, Deluxe Room Booking, Luxury Room Booking, Hyderabad Hotel">

        </ul>

    </nav>

</header>

<section class="contact">

    <h1>Book Your Stay</h1>

    <div class="contact-box">

        <form onsubmit="bookNow(); return false;">

            <label>Full Name</label><br>

            <input type="text"
                placeholder="Enter Your Full Name"
                required>

            <br><br>

            <label>Email Address</label><br>

            <input type="email"
                placeholder="Enter Your Email"
                required>

            <br><br>

            <label>Phone Number</label><br>

            <input type="tel"
                placeholder="Enter Your Phone Number"
                required>

            <br><br>

            <label>Select Room</label><br>

            <select required>

                <option value="">-- Select Room --</option>

                <option>Deluxe Room</option>

                <option>Luxury Room</option>

            </select>

            <br><br>

            <label>Check-in Date</label><br>

            <input type="date" required>

            <br><br>

            <label>Check-out Date</label><br>

            <input type="date" required>

            <br><br>

            <button type="submit">
                Book Now
            </button>

        </form>

    </div>

</section>
